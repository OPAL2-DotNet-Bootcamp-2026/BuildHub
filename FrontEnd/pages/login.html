<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Login</title>
</head>
<div class="login-page row g-0">
 
        
        <section class="login-visual col-lg-7">
            <img src="../assets/login.jpg" alt="Modern house exterior" class="login-visual__bg">
            <div class="login-visual__overlay"></div>
 
            <div class="login-visual__content">
                <div class="login-visual__brand">
                    <span class="brand-badge"></span>
                    <h1 class="brand-name">BuildHub</h1>
                </div>
 
                <blockquote class="login-visual__quote">
                    <p>"I posted my renovation job and had three verified offers by the next morning. Hired through escrow — no stress."</p>
                    <footer class="d-flex align-items-center gap-3">
                        <span class="avatar-circle">MR</span>
                        <span class="quote-name">
                            <strong><h2>Mohammed Al Hasni</h2></strong>
                            <span>Homeowner, Muscat</span>
                        </span>
                    </footer>
                </blockquote>
            </div>
        </section>
