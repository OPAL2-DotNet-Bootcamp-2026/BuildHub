<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/buildhup-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-128.png" sizes="128x128" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <title>Login</title>
</head>
<div class="login-page row g-0">
 
        
        <section class="login-visual col-lg-7">
            <img src="../assets/login.jpg" alt="Modern house exterior" class="login-visual__bg">
            <div class="login-visual__overlay"></div>
 
            <div class="login-visual__content">
                <div class="login-visual__brand">
                    <span class="brand-badge">
                        <img src="../assets/buildhup-icon.svg" alt="">
                    </span>
                    <h1 class="brand-name">BuildHub</h1>
                </div>
 
                <blockquote class="login-visual__quote">
                    <p>"I posted my renovation job and had three verified offers by the next morning. Hired through escrow — no stress."</p>
                    <footer class="d-flex align-items-center gap-3">
                        <span class="avatar-circle">MR</span>
                        <span class="quote-name">
                            <strong><h2>Mohammed Al Hasni</h2></strong>
                            <span>Homeowner, Muscat</span>
                        </span>
                    </footer>
                </blockquote>
            </div>
        </section>
 
        
        <section class="login-form-panel col-lg-5">
            <button type="button" class="lang-toggle">عربي</button>
 
            <div class="login-form-wrap">
                <h1>Welcome back</h1>
                <p class="subtitle">Sign in to continue</p>
 
                <form>
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="salim@example.com" required>
                       
                    </div>
 
                    <div class="mb-2">
                        <label for="inputPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="inputPassword" placeholder="••••••••" required>
                        
                      
                       
                    </div>
 
                    <div class="text-end mb-4">
                        <a href="#" class="forgot-link">Forgot password?</a>
                        
                    </div>
                </form>
 
                <p class="demo-label">Demo — sign in as:</p>
 
                <a href="../pages/Dashboard.html"><button type="button" class="btn demo-btn btn-primary w-100 mb-2">Homeowner</button></a>
                <button type="button" class="btn demo-btn btn-secondary w-100 mb-2">Vendor / Contractor</button>
                <button type="button" class="btn demo-btn btn-secondary w-100 mb-3">Admin</button>
 
                <p class="register-row">Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </section>
 
    </div>
 
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
