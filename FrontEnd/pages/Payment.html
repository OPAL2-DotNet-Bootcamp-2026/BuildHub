<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuildHub Dashboard</title>

    <!-- Connect Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

<!-- Agreement / payment page -->
<main class="container py-4">
    <!-- Keep the page content medium width -->
    <div class="row justify-content-center">
        <div class="col-9">
            <!-- Back link -->
            <a href="my-jobs.html" class="text-secondary text-decoration-none small">     <!--for navigate myjob.html , secondary mean gray , text-decoration-none mean remove the underline for the link -->
                ← Back to My Jobs
            </a>

<!-- Agreement / payment title -->
<div class="d-flex justify-content-between align-items-start mt-4 mb-4">
    <div>
        <h1 class="fs-3 fw-bold mb-1"> Agreement #O1 </h1>
        <p class="text-secondary small mb-0">
            Master Bathroom Renovation
        </p>
    </div>

<!-- Agreement status -->
        <span class="badge rounded-pill bg-info-subtle text-info-emphasis">
            Hired
        </span>

</div>

<!-- Main page columns -->
    <div class="row g-4">
        <!-- Left side -->
        <div class="col-8">
        <!-- Payment status -->
            <section class="mb-3">
            <h2 class="fs-6 fw-bold mb-3"> Payment Status</h2>
    <!-- Payment card -->
    <div class="alert alert-secondary rounded-5 d-flex align-items-center mb-0">

    <!-- Lock icon -->
        <span class="bg-body-secondary rounded-circle p-3 me-3"> 🔒 </span>
    <!-- Payment description -->
        <div class="flex-grow-1">
    <strong class="text-primary-emphasis"> Payment Held Securely </strong>

        <p class="small text-secondary mb-0">
            Your money is protected until you
            confirm the work is done.
        </p>

        </div>
    <!-- Payment value -->
        <div class="text-end">
            <strong class="fs-5 text-primary-emphasis"> OMR 1,200 </strong>

            <small class="d-block text-secondary"> Escrow </small>

        </div>

    </div>

</section>








</body>






</html>
