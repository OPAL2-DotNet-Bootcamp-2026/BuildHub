<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="../assets/buildhup-icon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-64.png"
      sizes="64x64"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-128.png"
      sizes="128x128"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>Browse and Compare Products</title>

    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
  </head>

  <body class="bg-body-tertiary">
    <shared-header></shared-header>

    <!-- Browse and compare products page -->
    <main class="container-fluid p-4">
      <!-- Page title -->
      <section class="mb-4">
        <h1 class="fs-3 fw-bold mb-1">Browse & Compare Products</h1>

        <p class="text-secondary small mb-0">
          Compare prices from different stores side by side.
        </p>
      </section>

      <section class="row g-3 mb-3">
        <!-- Search and category filter -->

        <!-- Search field -->
        <div class="col-9">
          <label for="productSearch" class="visually-hidden">
            Search products
          </label>

          <input
            type="search"
            id="productSearch"
            class="form-control"
            placeholder="Search products..."
          />
        </div>

        <!-- Category selection -->
        <div class="col-3">
          <label for="categoryFilter" class="visually-hidden">
            Select category
          </label>

          <select id="categoryFilter" class="form-select">
            <!-- select mean create the dropdown -->

            <option selected>All</option>
            <!--  option mean create choice for dropdown -->
            <option>Floor Tiles</option>
            <option>Wall Tiles</option>
            <option>Kitchen Fixtures</option>
            <option>Electrical</option>
          </select>
        </div>
      </section>

      <!-- for Category buttons -->
      <section class="d-flex gap-2 mb-4">
        <button
          type="button"
          class="btn btn-sm rounded-pill text-white border-0 shadow-none"
          style="background-color: var(--primary)"
        >
          All
        </button>

        <button type="button" class="btn btn-light btn-sm rounded-pill">
          Floor Tiles
        </button>

        <button type="button" class="btn btn-light btn-sm rounded-pill">
          Wall Tiles
        </button>

        <button type="button" class="btn btn-light btn-sm rounded-pill">
          Kitchen Fixtures
        </button>

        <button type="button" class="btn btn-light btn-sm rounded-pill">
          Electrical
        </button>
      </section>

      <!-- Product cards -->
      <section id="products-container" class="row g-4"></section>
    </main>
    <shared-footer></shared-footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../scripts/browseProduct.js"></script>
  </body>
</html>
