<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse and Compare Products</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">  <!-- Connect Bootstrap CSS -->

</head>


<body class="bg-body-tertiary">


<!-- Browse and compare products page -->
<main class="container-fluid p-4">


    <!-- Page title -->
    <section class="mb-4">

        <h1 class="fs-3 fw-bold mb-1">
            Browse & Compare Products
        </h1>

        <p class="text-secondary small mb-0">
            Compare prices from different stores side by side.
        </p>

    </section>


    <section class="row g-3 mb-3">  <!-- Search and category filter -->


        <!-- Search field -->
        <div class="col-9">

            <label for="productSearch" class="visually-hidden">
                Search products
            </label>

            <input type="search" id="productSearch" class="form-control" placeholder="Search products...">

        </div>


        <!-- Category selection -->
        <div class="col-3">

            <label for="categoryFilter" class="visually-hidden"> Select category </label>

            <select id="categoryFilter" class="form-select">  <!-- select mean create the dropdown -->

                <option selected>All</option>  <!--  option mean create choice for dropdown -->
                <option>Floor Tiles</option>
                <option>Wall Tiles</option>
                <option>Kitchen Fixtures</option>
                <option>Electrical</option>

            </select>

        </div>


    </section>

</body>






</html>
