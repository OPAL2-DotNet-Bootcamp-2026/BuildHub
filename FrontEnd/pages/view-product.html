<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/buildhup-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-128.png" sizes="128x128" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/view-product.css" />
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <title>Document</title>
  </head>
  <body>
    <shared-header></shared-header>

    <a href="javascript:history.back()" class="back-link">&larr; Back</a>

    <div class="product-container">
      <div class="gallery-container">
        <img src="../assets/constraction111.jpg" alt="Main Product Image" />

        <div class="thumbnails-group">
          <img
            src="../assets/constraction111.jpg"
            class="rounded mx-auto d-block"
            alt="Thumbnail 1"
          />
          <img
            src="../assets/constraction111.jpg"
            class="rounded mx-auto d-block"
            alt="Thumbnail 2"
          />
          <img
            src="../assets/constraction111.jpg"
            class="rounded mx-auto d-block"
            alt="Thumbnail 3"
          />
        </div>
      </div>

      <div class="details-container">
        <span class="category-badge">Floor Tiles</span>
        <h1 class="product-title">Beige Marble Floor Tile 60×60</h1>
        <p class="store-info">Salalah Tiles & Ceramics · Salalah</p>

        <div class="price-box">
          <span class="price-amount">OMR 14.5</span>
          <span class="price-unit">per sqm</span>
        </div>

        <p class="product-description">
          Premium polished marble-effect porcelain tile. Suitable for indoor
          floors and walls. Low water absorption.
        </p>

        <button class="btn-primary-custom">Contact Store</button>
        <button class="btn-secondary-custom">Save Product</button>

        <div class="specs-card">
          <div class="spec-row">
            <span class="spec-label">Category</span>
            <span class="spec-value">Floor Tiles</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Store</span>
            <span class="spec-value">Salalah Tiles & Ceramics</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">City</span>
            <span class="spec-value">Salalah</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Availability</span>
            <span class="spec-value">In Stock</span>
          </div>
        </div>
      </div>
    </div>

    <shared-footer></shared-footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
