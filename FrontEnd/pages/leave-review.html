<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/leave-review.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <title>Leave Review</title>
  </head>
  <body>
    <shared-header></shared-header>
    <main class="review-page">
      <a href="javascript:history.back()" class="back-link">&larr; Back</a>

      <h1>Leave a Review</h1>
      <p class="page-subtitle">Share your experience with this vendor</p>

      <div class="review-card">
        <div class="vendor-summary">
          <img src="../assets/client.png" class="vendor-photo" />
          <div>
            <p class="vendor-name">Salim Construction</p>
            <p class="vendor-meta">
              Job: Electrical Panel Upgrade<br />
              Completed: July 2027
            </p>
          </div>
        </div>

        <p class="field-label">How would you rate this vendor?</p>
        <div class="star-rating" role="radiogroup" aria-label="Vendor rating">
          <span
            class="star"
            role="radio"
            aria-checked="false"
            aria-label="1 star"
            >★</span
          >
          <span
            class="star"
            role="radio"
            aria-checked="false"
            aria-label="2 stars"
            >★</span
          >
          <span
            class="star"
            role="radio"
            aria-checked="false"
            aria-label="3 stars"
            >★</span
          >
          <span
            class="star"
            role="radio"
            aria-checked="false"
            aria-label="4 stars"
            >★</span
          >
          <span
            class="star"
            role="radio"
            aria-checked="false"
            aria-label="5 stars"
            >★</span
          >
        </div>

        <p class="field-label">Your detailed review:</p>
        <div class="review-textarea-wrap">
          <textarea
            class="review-textarea"
            maxlength="500"
            placeholder="Describe the quality of work, punctuality, communication, and anything that would help other homeowners..."
          ></textarea>
          <span class="char-counter">0/500</span>
        </div>

        <div class="review-actions">
          <button type="button" class="btn-skip">Skip</button>
          <button type="button" class="btn-submit-review" disabled>
            Submit Review
          </button>
        </div>
      </div>
    </main>

    <shared-footer></shared-footer>

    <script>
      const stars = document.querySelectorAll(".star-rating .star");
      const submitBtn = document.querySelector(".btn-submit-review");

      stars.forEach((star, index) => {
        star.addEventListener("click", () => {
          stars.forEach((s, i) => {
            const filled = i <= index;
            s.classList.toggle("is-filled", filled);
            s.setAttribute("aria-checked", filled);
          });
          submitBtn.disabled = false;
          submitBtn.classList.add("is-active");
        });
      });

      const textarea = document.querySelector(".review-textarea");
      const counter = document.querySelector(".char-counter");
      textarea.addEventListener("input", () => {
        counter.textContent = `${textarea.value.length}/500`;
      });
    </script>
  </body>
</html>
