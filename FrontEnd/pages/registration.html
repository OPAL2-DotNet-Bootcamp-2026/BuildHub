<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="../assets/buildhup-icon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-64.png"
      sizes="64x64"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-128.png"
      sizes="128x128"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <title>BuildHub - Registration</title>
  </head>

  <body>
    <div class="registration-page">
      <div class="row g-0">
        <!-- Left Side — same photo panel treatment as the login page -->
        <section class="login-visual col-lg-7">
          <img
            src="../assets/register.jpg"
            alt="BuildHub construction project"
            class="login-visual__bg"
          />
          <div class="login-visual__overlay"></div>

          <div class="login-visual__content">
            <div class="login-visual__brand">
              <span class="brand-badge">
                <img src="../assets/buildhup-icon.svg" alt="" />
              </span>
              <h1 class="brand-name">BuildHub</h1>
            </div>

            <div class="login-visual__tagline">
              <h2>Build Your Future</h2>
              <p>
                Connect with trusted professionals and bring your projects to
                life.
              </p>
            </div>
          </div>
        </section>

        <!-- Right Side -->
        <div class="col-lg-5 p-5" style="background-color: var(--bg)">
          <h1>Create your account</h1>
          <p>Join BuildHub for free</p>

          <div class="mt-4">
            <label class="form-label">I am a...</label>

            <div class="row g-3">
              <!-- Homeowner -->
              <div class="col-6">
                <button
                  type="button"
                  class="btn btn-outline-primary w-100 text-start p-3"
                >
                  🏠

                  <strong>Homeowner</strong>

                  <small>I want to hire</small>
                </button>
              </div>
              <!--Vendor-->
              <div class="col-6">
                <button
                  type="button"
                  class="btn btn-outline-primary w-00 text-start p-3"
                >
                  🔨

                  <strong>Vendor</strong>

                  <small>I want to get work</small>
                </button>
              </div>
            </div>
          </div>
          <!-- row -->

          <!-- Full Name -->
          <div class="mb-3 mt-4">
            <label for="fullName" class="form-label">
              Full name <span class="text-danger">*</span>
            </label>

            <input
              type="text"
              id="fullName"
              class="form-control"
              placeholder="Salim Al-Balushi"
            />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">
              Email address <span class="text-danger">*</span>
            </label>

            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="you@example.com"
            />
          </div>

          <!-- Password -->
          <div class="mb-2">
            <label for="password" class="form-label">
              Password <span class="text-danger">*</span>
            </label>

            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
            />

            <small class="text-muted"> At least 8 characters </small>
          </div>
          <!-- Create Account Button -->
          <div class="d-grid mt-4">
            <button
              type="submit"
              class="btn text-white"
              style="background-color: var(--accent)"
            >
              Create Account
            </button>
          </div>

          <!-- Terms and Privacy -->
          <p class="text-center text-muted small mt-3">
            By registering, you agree to our

            <a href="#" class="text-decoration-none"> Terms of Service </a>

            &

            <a href="#" class="text-decoration-none"> Privacy Policy </a>
          </p>

          <!-- Login -->
          <p class="text-center text-muted mt-3">
            Already have an account?

            <a
              href="../pages/login.html"
              class="text-decoration-none fw-semibold"
            >
              Log in
            </a>
          </p>
        </div>
        <!-- right side -->
      </div>
      <!-- row -->
    </div>
    <!-- registration-page -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
