<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildHub - Registration</title>
</head>

<body>

<div class="registration-page">
    <div class="registration-container">
        <h1>Create your account</h1>
        <p>Join BuildHub for free</p>
        <h3>I am a...</h3>
        <button type="button">Homeowner</button>
        <button type="button">Vendor</button>
        <br>
        <label for="fullName">Full Name</label><br>
        <input type="text" id="fullName" placeholder="Enter your full name"><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Enter your email"><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="********"><br>
        <button type="submit">Create Account</button>

       <p>
            Already have an account?
            <a href="login.html">Log in</a>
       </p>
        </div>

</div>
</body>

</html>
