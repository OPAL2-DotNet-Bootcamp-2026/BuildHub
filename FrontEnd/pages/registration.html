<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/buildhup-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-128.png" sizes="128x128" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>BuildHub - Registration</title>
</head>

<body>

<div class="registration-page">
     <div class="container">
        
        <div class="row min-vh-100">

            <!-- Left Side -->
<div class="col-md-6 p-0">

    <div class="h-100 position-relative">

        <img src="../assets/RegistrationImg.jpg"
             class="w-100 h-100 object-fit-cover"
             alt="BuildHub construction project">

        <!-- Dark overlay -->
        <div class="position-absolute top-0 start-0 w-100 h-100"
             style="background-color: rgba(8, 38, 70, 0.65);">
        </div>


        <!-- BuildHub Logo -->
        <div class="position-absolute top-0 start-0 m-5
                    d-flex align-items-center gap-2 text-white">

            <!-- Logo mark on a white disc, so it stays legible on the photo -->
            <div class="rounded-circle bg-white
                        d-flex align-items-center justify-content-center"
                 style="width: 40px; height: 40px;">
                <img src="../assets/buildhup-icon.svg" alt=""
                     style="width: 28px; height: 28px;">
            </div>

            <!-- BuildHub -->
            <span class="fs-4 fw-bold">
                BuildHub
            </span>

        </div>


        <!-- Text at bottom -->
        <div class="position-absolute bottom-0 start-0
                    text-white p-5">

            <h2 class="fw-bold">
                Build Your Future
            </h2>

            <p>
                Connect with trusted professionals
                and bring your projects to life.
            </p>

        </div>

    </div>

</div>

            <!-- Right Side -->
            <div class="col-md-6 p-5" style="background-color: var(--bg);">

                <h1>Create your account</h1>
                <p>Join BuildHub for free</p>

                <div class="mt-4">

                    <label class="form-label">I am a...</label>

                    <div class="row g-3">

                        <!-- Homeowner -->
                        <div class="col-6">
                            <button type="button"
                                    class="btn btn-outline-primary w-100 text-start p-3">

                                🏠
                                <br>

                                <strong>Homeowner</strong>

                                <br>

                                <small>I want to hire vendors</small>

                            </button>
                        </div>


                       <!-- Vendor -->
<div class="col-6">
    <button type="button"
            class="btn btn-outline-primary w-100 text-start p-3">

        🔨
        <br>

        <strong>Vendor</strong>

        <br>

        <small>I want to get work</small>

    </button>
</div>

</div> <!-- row -->

<!-- Full Name -->
<div class="mb-3 mt-4">

    <label for="fullName" class="form-label">
        Full name <span class="text-danger">*</span>
    </label>

    <input type="text"
           id="fullName"
           class="form-control"
           placeholder="Salim Al-Balushi">

</div>

<!-- Email -->
<div class="mb-3">

    <label for="email" class="form-label">
        Email address <span class="text-danger">*</span>
    </label>

    <input type="email"
           id="email"
           class="form-control"
           placeholder="you@example.com">

</div>

<!-- Password -->
<div class="mb-2">

    <label for="password" class="form-label">
        Password <span class="text-danger">*</span>
    </label>

    <input type="password"
           id="password"
           class="form-control"
           placeholder="••••••••">

    <small class="text-muted">
        At least 8 characters
    </small>

</div>
    <!-- Create Account Button -->
<div class="d-grid mt-4">

    <button type="submit" class="btn text-white"
         style="background-color: var(--accent);">
    Create Account
    </button>

</div>



<!-- Terms and Privacy -->
<p class="text-center text-muted small mt-3 ">

    By registering, you agree to our

    <a href="#" class="text-decoration-none">
        Terms of Service
    </a>

    &

    <a href="#" class="text-decoration-none">
        Privacy Policy
    </a>

</p>


<!-- Login -->
<p class="text-center text-muted mt-3">

    Already have an account?

    <a href="../pages/login.html"
       class="text-decoration-none fw-semibold">
        Log in
    </a>

</p>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>

</html>
