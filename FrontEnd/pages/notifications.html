<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/buildhup-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="../assets/buildhup-icon-128.png" sizes="128x128" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/notifications.css" />
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <title>Notifications</title>
  </head>
  <body>
    <shared-header></shared-header>

    <main class="notif-page">
      <h1>Notifications</h1>
      <p class="page-subtitle">Loading…</p>

      <section class="notif-section" id="unread-section">
        <p class="notif-section-label">Unread</p>
        <div class="notif-list" id="unread-list">
          <!-- filled in by scripts/notifications.js -->
        </div>
      </section>

      <section class="notif-section">
        <p class="notif-section-label">Earlier</p>
        <div class="notif-list" id="earlier-list">
          <!-- filled in by scripts/notifications.js -->
        </div>
      </section>
    </main>

    <shared-footer></shared-footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../components/notifications.js"></script>
  </body>
</html>
