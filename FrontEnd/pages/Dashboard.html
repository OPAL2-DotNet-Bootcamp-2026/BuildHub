<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuildHub Dashboard</title>

    <!-- Connect Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body class="bg-body-tertiary">

    <main class="container-fluid p-4">

        <!-- Welcome section -->

        <section class="mb-4">

            <h1 class="fs-3 fw-bold">
                Good morning, Salim 👋
            </h1>

            <p class="small text-secondary">
                You have 3 new offers waiting for your review.
            </p>

        </section>


<!-- Statistics section -->

        <section class="row g-3 mb-4">

            <!-- for Open jobs card -->

            <div class="col-3">  

                <article class="card h-100 border shadow-sm rounded-3">

                    <div class="card-body d-flex
                                justify-content-between
                                align-items-center">

                        <div>
                            <p class="small text-uppercase text-secondary mb-1">
                                Open Jobs
                            </p>

                            <h2 class="fs-4 fw-bold mb-0">
                                2
                            </h2>
                        </div>

                        <span class="bg-secondary-subtle rounded-circle p-3">📋
                        </span>

                    </div>

                </article>

            </div>


            <!-- New offers -->

            <div class="col-3">

                <article class="card h-100 border shadow-sm rounded-3">

                    <div class="card-body d-flex justify-content-between align-items-center">

                        <div>
                            <p class="small text-uppercase text-secondary mb-1">
                                New Offers
                            </p>

                            <h2 class="fs-4 fw-bold mb-0">
                                3
                            </h2>
                        </div>

                        <span class="bg-danger-subtle rounded-circle p-3">
                            📬
                        </span>

                    </div>

                </article>

            </div>

</body>

</html>
