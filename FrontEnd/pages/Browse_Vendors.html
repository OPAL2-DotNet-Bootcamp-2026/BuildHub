<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Browse Vendors</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body class="bg-light">

    <main class="container-fluid px-4 py-4">


        <!-- Page Title -->

        <div class="mb-3">

            <h2 class="fw-bold">
                Browse Vendors
            </h2>

            <p class="text-muted small mb-0">
                5 vendors available
            </p>

        </div>

        <!-- Search and Filters -->

        <div class="card rounded-4 p-3 mb-3">

            <div class="row g-2">


                <!-- Search -->

                <div class="col-lg-6">

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="text"
                               class="form-control"
                               placeholder="Search vendors...">

                    </div>

                </div>

                <!-- Category -->

                <div class="col-lg-2">

                    <select class="form-select">

                        <option selected>
                            All Categories
                        </option>

                        <option>
                            General Contractor
                        </option>

                        <option>
                            Interior Designer
                        </option>

                        <option>
                            Plumber
                        </option>

                        <option>
                            Electrician
                        </option>

                    </select>

                </div>

                <!-- City -->

                <div class="col-lg-2">

                    <select class="form-select">

                        <option selected>
                            All Cities
                        </option>

                        <option>
                            Muscat
                        </option>

                        <option>
                            Salalah
                        </option>

                        <option>
                            Sohar
                        </option>

                    </select>

                </div>

                <!-- Sort -->

                <div class="col-lg-2">

                    <select class="form-select">

                        <option selected>
                            Highest Rated
                        </option>

                        <option>
                            Most Jobs
                        </option>

                        <option>
                            Newest
                        </option>

                    </select>

                </div>

            </div>

        </div>
              <!-- Categories -->

        <div class="d-flex flex-wrap gap-2 mb-3">

            <button type="button"
                    class="btn text-white rounded-pill px-4"
                    style="background-color:#0d3b66; border-color:#0d3b66;">
                All
            </button>

            <button class="btn bbtn-light btn-sm rounded-pill">
                🏗 General Contractor
            </button>

            <button class="btn btn-light btn-sm rounded-pill">
                🛋 Interior Designer
            </button>

            <button class="btn btn-light btn-sm rounded-pill">
                🔧 Plumber
            </button>

            <button class="btn btn-light btn-sm rounded-pill">
                ⚡ Electrician
            </button>

            <button class="btn btn-light btn-sm rounded-pill">
                🧱 Tiles & Ceramics
            </button>

            <button class="btn btn-light btn-sm rounded-pill">
                🍳 Kitchen Fitting
            </button>

        </div>
