<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="../assets/buildhup-icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="../assets/buildhup-icon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-64.png"
      sizes="64x64"
      type="image/png"
    />
    <link
      rel="icon"
      href="../assets/buildhup-icon-128.png"
      sizes="128x128"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="../assets/buildhup-icon-128.png" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- BuildHub shared styles -->
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>Browse Vendors</title>

    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
  </head>
  <body class="bg-light">
    <shared-header></shared-header>

    <main class="container py-4">
      <div class="mb-3">
        <h2 class="fw-bold">Browse Vendors</h2>

        <p class="text-muted small mb-0">5 vendors available</p>
      </div>

      <!-- Search and Filters -->

      <div class="card rounded-4 p-3 mb-3">
        <div class="row g-2">
          <!-- Search -->

          <div class="col-lg-6">
            <div class="input-group">
              <span class="input-group-text bg-white">
                <i class="bi bi-search"></i>
              </span>

              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search vendors..."
              />
            </div>
          </div>

          <!-- Category -->

          <div class="col-lg-2">
            <select id="categorySelect" class="form-select">
              <option selected>All Categories</option>

              <option>General Contractor</option>

              <option>Interior Designer</option>

              <option>Plumber</option>

              <option>Electrician</option>
            </select>
          </div>

          <!-- City -->

          <div class="col-lg-2">
            <select  id="citySelect" class="form-select">
              <option selected>All Cities</option>

              <option>Muscat</option>

              <option>Salalah</option>

              <option>Sohar</option>
            </select>
          </div>

          <!-- Sort -->

          <div class="col-lg-2">
            <select class="form-select">
              <option selected>Highest Rated</option>

              <option>Most Jobs</option>

              <option>Newest</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Categories -->

      <div class="d-flex flex-wrap gap-2 mb-3">
        <button
          type="button"
          class="btn text-white rounded-pill px-4"
          style="background-color: var(--primary); border-color: var(--primary)"
        >
          All
        </button>

        <button class="btn btn-light btn-sm rounded-pill">
          🏗 General Contractor
        </button>

        <button class="btn btn-light btn-sm rounded-pill">
          🛋 Interior Designer
        </button>

        <button class="btn btn-light btn-sm rounded-pill">🔧 Plumber</button>

        <button class="btn btn-light btn-sm rounded-pill">
          ⚡ Electrician
        </button>

        <button class="btn btn-light btn-sm rounded-pill">
          🧱 Tiles & Ceramics
        </button>

        <button class="btn btn-light btn-sm rounded-pill">
          🍳 Kitchen Fitting
        </button>
      </div>

      <!-- Vendors -->

      <p class="text-muted small mb-0" id="vendors-count">Loading vendors...</p>

      <!-- إعطاء id للـ Grid container وتنظيف الكروت المكررة -->
      <div class="row g-3" id="vendors-container">
          <!-- السي شارب والـ JS بيضيفوا الكروت هنا ديناميكياً -->
      </div>
    </main>
    <shared-footer></shared-footer>
    <script src="../components/Browse-vender.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
